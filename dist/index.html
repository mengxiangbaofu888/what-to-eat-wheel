<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>吃啥转盘 · 今天吃啥交给它</title>
<meta name="description" content="自定义菜名、拍照识别食堂菜品、按大类/小项挑菜，转盘随机决定今天吃什么。">
<meta name="theme-color" content="#151221">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23ff8a3d'/%3E%3Cpath d='M32 32 L32 4 A28 28 0 0 1 56.2 18 Z' fill='%23ffd166'/%3E%3Cpath d='M32 32 L56.2 18 A28 28 0 0 1 56.2 46 Z' fill='%23ef476f'/%3E%3Cpath d='M32 32 L56.2 46 A28 28 0 0 1 32 60 Z' fill='%2306d6a0'/%3E%3Cpath d='M32 32 L32 60 A28 28 0 0 1 7.8 46 Z' fill='%234cc9f0'/%3E%3Cpath d='M32 32 L7.8 46 A28 28 0 0 1 7.8 18 Z' fill='%23845ec2'/%3E%3Cpath d='M32 32 L7.8 18 A28 28 0 0 1 32 4 Z' fill='%23f78c6b'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ============================================================
   吃啥转盘 · 样式
   ============================================================ */

:root {
  --bg: #151221;
  --bg-2: #1e1930;
  --card: rgba(255, 255, 255, 0.06);
  --card-solid: #221c36;
  --line: rgba(255, 255, 255, 0.12);
  --text: #f4f1ff;
  --text-dim: #a99fc4;
  --brand: #ff8a3d;
  --brand-2: #ffd166;
  --accent: #8b5cf6;
  --ok: #06d6a0;
  --danger: #ef476f;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: dark;
}

:root[data-theme='light'] {
  --bg: #fdf7f1;
  --bg-2: #ffffff;
  --card: rgba(28, 20, 10, 0.04);
  --card-solid: #ffffff;
  --line: rgba(40, 25, 10, 0.12);
  --text: #241a12;
  --text-dim: #8a7a6b;
  --brand: #f4741f;
  --brand-2: #f5b301;
  --accent: #6d38e0;
  --shadow: 0 10px 26px rgba(120, 80, 40, 0.16);
  color-scheme: light;
}

/*
 * 安卓原生壳（Capacitor）里 WebView 是 edge-to-edge 的：内容一直画到状态栏下面，
 * 而 env(safe-area-inset-top) 在不少机型的 WebView 上会返回 0——
 * 结果顶栏（主题切换按钮）被状态栏压住，点不着。
 * 所以原生壳里给个保底值：取「系统报的 inset」和「36px」中较大的那个。
 * 用 max() 两边都不亏：系统报得更大就听系统的，报 0 就用保底值。
 */
html.is-native {
  --safe-t: max(env(safe-area-inset-top, 0px), 36px);
  --safe-b: max(env(safe-area-inset-bottom, 0px), 8px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/*
 * 必须放在最前面，而且必须带 !important。
 * 浏览器的默认样式里 `[hidden] { display: none }` 只是一个**元素选择器**；
 * 我们后面写了 `.modal-mask { display: grid }` 这种类选择器，优先级更高，
 * 会把 hidden 直接压掉——结果就是遮罩从一开始就一直盖在整个界面上，
 * 里面还是个空弹窗，点哪儿都没反应，看起来就像「一打开就卡死」。
 * （这个坑 jsdom 测不出来，因为 jsdom 不做完整的 CSS 层叠。）
 */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overscroll-behavior: none;
}

body {
  background:
    radial-gradient(1100px 700px at 12% -8%, rgba(255, 138, 61, 0.20), transparent 60%),
    radial-gradient(900px 620px at 100% 0%, rgba(139, 92, 246, 0.22), transparent 55%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  background-attachment: fixed;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
    'Microsoft YaHei', 'Noto Sans SC', Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 1180px;
  margin: 0 auto;
  padding: calc(8px + var(--safe-t)) 12px calc(8px + var(--safe-b));
  gap: 8px;
}

/* ---------------- 顶栏 ---------------- */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: 0 0 auto;
  padding: 2px 2px 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: 0.5px;
}
.brand-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: conic-gradient(var(--brand), var(--brand-2), var(--ok), var(--accent), var(--brand));
  box-shadow: 0 0 12px rgba(255, 138, 61, 0.7);
}
.top-actions { display: flex; gap: 6px; }

.icon-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s;
  flex: 0 0 auto;
}
.icon-btn:active { transform: scale(0.92); }

/* ---------------- 转盘区 ---------------- */

.stage {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.wheel-wrap {
  position: relative;
  width: min(78vw, 42vh, 420px);
  aspect-ratio: 1 / 1;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
}

#wheel {
  width: 100%;
  height: 100%;
  display: block;
  filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.35));
  touch-action: manipulation;
}

.pointer {
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 13px solid transparent;
  border-right: 13px solid transparent;
  border-top: 26px solid var(--brand);
  filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.45));
  z-index: 3;
  pointer-events: none;
}

.spin-btn {
  position: absolute;
  width: 26%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 4px solid rgba(255, 255, 255, 0.85);
  background: radial-gradient(circle at 35% 30%, #fff5e6, #ffb457 55%, #ff7a1a);
  color: #4a2400;
  font-weight: 800;
  display: grid;
  place-content: center;
  gap: 0;
  line-height: 1;
  cursor: pointer;
  z-index: 4;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), inset 0 -3px 8px rgba(160, 80, 0, 0.25);
  transition: transform 0.12s;
  user-select: none;
}
.spin-btn:active { transform: scale(0.94); }
.spin-btn[disabled] { filter: grayscale(0.6) brightness(0.85); cursor: not-allowed; }
.spin-btn-main { font-size: clamp(18px, 4.6vmin, 30px); }
.spin-btn-sub { font-size: clamp(9px, 1.6vmin, 12px); opacity: 0.7; font-weight: 600; margin-top: 2px; }

/* ---------------- 结果区 ---------------- */

.result-bar {
  flex: 0 0 auto;
  width: 100%;
  max-width: 560px;
  text-align: center;
  min-height: 30px;
}
.result-empty { color: var(--text-dim); font-size: 13px; }
.result-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 12px 10px;
  backdrop-filter: blur(10px);
  animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.5, 1);
}
@keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* 「就吃这个」之后的状态卡：把结果定下来，不再只是「再来一次」 */
.decided-card {
  background: linear-gradient(135deg, rgba(6, 214, 160, 0.16), rgba(255, 138, 61, 0.14));
  border: 1px solid rgba(6, 214, 160, 0.45);
  border-radius: var(--radius);
  padding: 8px 12px 10px;
  animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.5, 1);
}
.decided-card .result-name { background: linear-gradient(92deg, var(--ok), var(--brand-2)); -webkit-background-clip: text; background-clip: text; }
.result-label { font-size: 11px; color: var(--text-dim); letter-spacing: 2px; }
.result-name {
  font-size: clamp(20px, 5.2vmin, 30px);
  font-weight: 800;
  background: linear-gradient(92deg, var(--brand), var(--brand-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  word-break: break-all;
}
.result-cat { font-size: 12px; color: var(--text-dim); margin-top: -2px; }
.result-actions { display: flex; gap: 8px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }

.history { margin-top: 6px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.history-chip {
  font-size: 11px;
  color: var(--text-dim);
  border: 1px dashed var(--line);
  border-radius: 999px;
  padding: 1px 8px;
}

/* ---------------- 面板 ---------------- */

.panel {
  flex: 0 0 auto;
  max-height: 46vh;
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  backdrop-filter: blur(12px);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.tabs { display: flex; flex: 0 0 auto; border-bottom: 1px solid var(--line); }
.tab {
  flex: 1;
  padding: 10px 4px;
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  position: relative;
  font-family: inherit;
}
.tab.active { color: var(--text); }
.tab.active::after {
  content: '';
  position: absolute;
  left: 18%; right: 18%; bottom: 0; height: 2.5px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--brand), var(--brand-2));
}

.tab-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pane { display: none; padding: 10px; }
.pane.active { display: block; }

/* ---------------- 控件 ---------------- */

.input {
  width: 100%;
  padding: 9px 11px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.16);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  outline: none;
}
:root[data-theme='light'] .input { background: rgba(255, 255, 255, 0.8); }
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(255, 138, 61, 0.16); }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 30px; }

.btn {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  padding: 9px 14px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: transform 0.12s, filter 0.15s;
  white-space: nowrap;
}
.btn:active { transform: scale(0.96); }
.btn.primary { background: linear-gradient(135deg, var(--brand), #ff6a2b); border-color: transparent; color: #fff; }
.btn.ghost { background: transparent; }
.btn.tiny { padding: 5px 10px; font-size: 12px; border-radius: 999px; font-weight: 500; }
.btn.sm { padding: 6px 11px; font-size: 12.5px; }
.btn.danger { color: var(--danger); border-color: rgba(239, 71, 111, 0.4); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

.row { display: flex; gap: 8px; align-items: center; }
.row > .input { flex: 1; }
.spacer { flex: 1; }
.add-row { display: flex; gap: 8px; }
.add-row .input { flex: 1; }
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }

.field { margin-bottom: 12px; }
.label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; font-weight: 600; }
.hint { font-size: 11.5px; color: var(--text-dim); margin-top: 5px; line-height: 1.45; }
.sep { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
.mono { font-variant-numeric: tabular-nums; }

.check { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; font-size: 13.5px; user-select: none; }
input[type='checkbox'] {
  appearance: none;
  width: 19px; height: 19px;
  flex: 0 0 auto;
  border-radius: 6px;
  border: 1.5px solid var(--line);
  background: rgba(0, 0, 0, 0.15);
  cursor: pointer;
  position: relative;
  transition: background 0.15s, border-color 0.15s;
}
input[type='checkbox']:checked { background: linear-gradient(135deg, var(--brand), #ff6a2b); border-color: transparent; }
input[type='checkbox']:checked::after {
  content: '';
  position: absolute; left: 6px; top: 2.5px;
  width: 4px; height: 9px;
  border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(42deg);
}
input[type='checkbox']:indeterminate { background: var(--accent); border-color: transparent; }
input[type='checkbox']:indeterminate::after {
  content: ''; position: absolute; left: 4px; top: 7.5px; width: 9px; height: 2px; background: #fff; border-radius: 2px;
}

.range-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-dim); margin-top: 6px; }
.range-row input[type='range'] { flex: 1; accent-color: var(--brand); }

/* ---------------- 分类列表 ---------------- */

.cat-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.cat-group { border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; background: rgba(255, 255, 255, 0.03); }
:root[data-theme='light'] .cat-group { background: rgba(255, 255, 255, 0.7); }
.cat-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: rgba(255, 255, 255, 0.04); cursor: pointer; }
:root[data-theme='light'] .cat-head { background: rgba(0, 0, 0, 0.03); }
.cat-name { font-weight: 700; font-size: 13.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-count { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.chev { transition: transform 0.2s; color: var(--text-dim); font-size: 11px; }
.cat-group.collapsed .chev { transform: rotate(-90deg); }
.cat-group.collapsed .cat-items { display: none; }
.cat-items { display: flex; flex-direction: column; }
.cat-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--line); }
.cat-item:hover { background: rgba(255, 255, 255, 0.03); }
.item-name { flex: 1; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.cat-item.off .item-name { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--line); }

/*
 * 点按区域必须够大。
 * 之前分类头和每道菜右边的按钮只有 18×18 像素（font-size 12px + padding 3px 5px），
 * 手机上根本点不中——用户反馈「分类名字改不了」就是这个原因。
 * 现在统一做成 34×34 的最小可点区域（Material 的推荐下限是 48，
 * 但这里是列表里的次级操作，34 已经是能稳定点中的尺寸了）。
 */
.mini {
  border: none; background: transparent; color: var(--text-dim);
  font-size: 15px; line-height: 1;
  width: 34px; height: 34px; min-width: 34px;
  display: grid; place-items: center;
  border-radius: 9px; cursor: pointer; font-family: inherit;
  padding: 0;
}
.mini:hover, .mini:active { background: var(--card); color: var(--text); }
.mini.danger:hover, .mini.danger:active { color: var(--danger); background: rgba(239, 71, 111, 0.12); }

/* 大一点的主操作按钮（分类头右边那个「⋯」） */
.mini.wide { width: auto; min-width: 44px; padding: 0 10px; font-size: 13px; font-weight: 600; }

/* ---------------- 操作菜单（点「⋯」弹出来的那个） ---------------- */

.sheet-list { display: flex; flex-direction: column; margin: 4px -4px 0; }
.sheet-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 13px 10px;
  background: none; border: none;
  border-bottom: 1px solid var(--line);
  color: var(--text);
  font-size: 15px; font-family: inherit; text-align: left;
  cursor: pointer;
  border-radius: 8px;
}
.sheet-item:last-child { border-bottom: none; }
.sheet-item:active { background: var(--card); }
.sheet-item.danger { color: var(--danger); }
.sheet-item-icon { width: 22px; text-align: center; font-size: 16px; }
.sheet-item-hint { font-size: 11.5px; color: var(--text-dim); margin-left: auto; }
.empty-tip { text-align: center; color: var(--text-dim); font-size: 12.5px; padding: 18px 10px; line-height: 1.7; }

/* ---------------- 拍照识别 ---------------- */

.photo-drop {
  border: 1.5px dashed var(--line);
  border-radius: var(--radius);
  padding: 18px 14px;
  text-align: center;
}
.photo-drop-icon { font-size: 30px; }
.photo-drop-title { font-weight: 700; margin-top: 4px; }
.photo-drop-sub { font-size: 12px; color: var(--text-dim); margin: 4px 0 12px; }
.photo-btns { display: flex; gap: 8px; justify-content: center; }

.photo-preview { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
.photo-preview img { height: 84px; border-radius: 10px; border: 1px solid var(--line); flex: 0 0 auto; }

.status { margin-top: 10px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.status.err { color: var(--danger); }
.status.ok { color: var(--ok); }
.spinner {
  width: 14px; height: 14px; flex: 0 0 auto;
  border: 2px solid var(--line); border-top-color: var(--brand);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.recognized { margin-top: 10px; }
.rec-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; }
.rec-row { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.rec-row .input { padding: 6px 9px; font-size: 13px; }
.rec-name { flex: 1.4; }
.rec-cat { flex: 1; }
.rec-actions { display: flex; gap: 8px; margin-top: 10px; }

/* ---------------- 弹窗 / 提示 ---------------- */

.modal-mask {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(3px);
  display: grid; place-items: center;
  padding: 20px;
  animation: fade 0.15s;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: 100%; max-width: 400px;
  background: var(--card-solid);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  max-height: 84vh; overflow-y: auto;
  animation: pop 0.22s cubic-bezier(0.2, 1.3, 0.5, 1);
}
.modal h3 { margin: 0 0 10px; font-size: 16px; }
.modal p { margin: 0 0 10px; font-size: 13.5px; color: var(--text-dim); line-height: 1.65; }
.modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.modal .field:last-child { margin-bottom: 0; }
.modal ul { margin: 0 0 10px; padding-left: 18px; font-size: 13.5px; color: var(--text-dim); line-height: 1.75; }
.modal code { background: var(--card); padding: 1px 5px; border-radius: 5px; font-size: 12px; }

.toast-wrap {
  position: fixed; left: 0; right: 0; bottom: calc(18px + var(--safe-b));
  z-index: 120; display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none;
}
.toast {
  background: rgba(20, 15, 30, 0.94);
  color: #fff;
  border: 1px solid var(--line);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  max-width: 86vw;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  animation: toastIn 0.22s ease-out;
}
.toast.err { background: rgba(120, 20, 45, 0.96); }
.toast.ok { background: rgba(6, 90, 70, 0.96); }
@keyframes toastIn { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 110; }

/* ---------------- 宽屏 ---------------- */

@media (min-width: 900px) {
  .app {
    display: grid;
    grid-template-columns: minmax(360px, 1fr) minmax(380px, 1.05fr);
    grid-template-rows: auto 1fr;
    grid-template-areas: 'top top' 'stage panel';
    gap: 14px 22px;
    padding: 14px 20px;
  }
  .topbar { grid-area: top; }
  .stage { grid-area: stage; }

        class: 'sheet-item' + (it.danger ? ' danger' : ''),
        onclick: function () {
          if (resolved) return;
          resolved = true;
          if (current) current.close(it.value === undefined ? it.text : it.value);
        },
      }, [
        el('span', { class: 'sheet-item-icon', text: it.icon || '' }),
        el('span', { text: it.text }),
        it.hint ? el('span', { class: 'sheet-item-hint', text: it.hint }) : null,
      ]));
    });
    return open({ title: opts.title, hint: opts.hint, body: body, actions: [{ text: '取消', value: null }] });
  }

  function toast(message, type, ms) {

    setTimeout(function () {
      node.style.transition = 'opacity .3s, transform .3s';
      node.style.opacity = '0';
      node.style.transform = 'translateY(8px)';

  /* ------------------------------ 撒花 ------------------------------ */

  var confettiRaf = null;
  function confetti() {
    var canvas = U.$('#confetti');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var dpr = Math.min(global.devicePixelRatio || 1, 2);
    var W0 = global.innerWidth, H0 = global.innerHeight;
    canvas.width = W0 * dpr;
    canvas.height = H0 * dpr;
    canvas.hidden = false;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var colors = ['#ff8a3d', '#ffd166', '#06d6a0', '#8b5cf6', '#ef476f', '#4cc9f0'];
    var parts = [];
    for (var i = 0; i < 110; i++) {
      parts.push({
        x: W0 / 2 + (Math.random() - 0.5) * W0 * 0.5,
        y: H0 * 0.34 + (Math.random() - 0.5) * 60,
        vx: (Math.random() - 0.5) * 9,
        vy: -6 - Math.random() * 9,
        size: 5 + Math.random() * 7,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        color: colors[(Math.random() * colors.length) | 0],
        life: 0,
      });
    }
    var start = 0;
    function frame(now) {
      if (!start) start = now;
      var elapsed = now - start;
      ctx.clearRect(0, 0, W0, H0);
      parts.forEach(function (p) {
        p.vy += 0.42;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.vx *= 0.995;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, 1 - elapsed / 2200);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.62);
        ctx.restore();
      });
      if (elapsed < 2200) confettiRaf = global.requestAnimationFrame(frame);
      else {
        ctx.clearRect(0, 0, W0, H0);
        canvas.hidden = true;
        confettiRaf = null;
      }
    }
    if (confettiRaf) global.cancelAnimationFrame(confettiRaf);
    confettiRaf = global.requestAnimationFrame(frame);
  }

  W.UI = { init: init, open: open, form: form, sheet: sheet, toast: toast, confetti: confetti, close: closeModal, panic: panic };

/* ============================================================

(function (global) {

  /* ============================== 主题 ============================== */

  function applyTheme() {
    var t = S.settings.theme || 'auto';
    var resolved = t === 'auto' ? (media && media.matches ? 'light' : 'dark') : t;

  }

  function cycleTheme() {
    var order = ['auto', 'dark', 'light'];
    var i = order.indexOf(S.settings.theme || 'auto');
    S.setSetting('theme', order[(i + 1) % order.length]);
    applyTheme();
    UI.toast('主题：' + ({ auto: '跟随系统', dark: '深色', light: '浅色' })[S.settings.theme]);

  /* ============================== 标签页 ============================== */

  function switchTab(name) {
    U.$$('.tab').forEach(function (t) { t.classList.toggle('active', t.dataset.tab === name); });
    U.$$('.pane').forEach(function (p) { p.classList.toggle('active', p.dataset.pane === name); });

  /* ============================== 菜品列表 ============================== */

  function renderList() {
    var list = els.catList;
    U.clear(list);
    var groups = S.groups();
    var total = S.data.items.length;

    if (!total) {
      list.appendChild(el('div', {
        class: 'empty-tip',
        html: '还没有菜品～<br>在上面输入菜名回车就能加，或者去「📷 拍照识别」拍一张食堂菜牌。',
      }));
      return;
    }

    var visible = groups.filter(function (g) { return g.items.length || !g.virtual; });

    visible.forEach(function (g) {
      if (g.virtual && !g.items.length) return;
      var onCount = g.items.filter(function (i) { return i.enabled; }).length;
      var allOn = g.items.length > 0 && onCount === g.items.length;
      var someOn = onCount > 0 && !allOn;

      var headBox = el('input', { type: 'checkbox', checked: allOn });
      headBox.indeterminate = someOn;
      headBox.addEventListener('click', function (e) {
        e.stopPropagation();
        S.setManyEnabled(g.items.map(function (i) { return i.id; }), !allOn);
      });

      var head = el('div', { class: 'cat-head', onclick: function (e) {
        if (e.target.closest('button') || e.target === headBox) return;

      } }, [
        headBox,
        el('span', { class: 'cat-name', text: g.name }),
        el('span', { class: 'cat-count', text: onCount + '/' + g.items.length }),

      if (!g.virtual) {
        head.appendChild(el('button', {
          class: 'mini',
          title: '大类操作',
          text: '⋯',
          onclick: function (e) { e.stopPropagation(); categoryMenu(g.id); },

      var itemsBox = el('div', { class: 'cat-items' });

        ]);

      });

      list.appendChild(group);
    });

  /** 点大类右边的「⋯」：重命名 / 在这个大类下加菜 / 删除 */
  function categoryMenu(id) {
    var cat = S.findCategory(id);
    if (!cat) return;
    var count = S.itemsOf(id).length;
    UI.sheet({
      title: cat.name + '（' + count + ' 道菜）',
      items: [
        { icon: '✏️', text: '重命名这个大类', value: 'rename' },
        { icon: '➕', text: '往这个大类里加菜', hint: '一行一个', value: 'add' },
        { icon: '🎯', text: '只转这个大类里的菜', value: 'solo' },
        { icon: '🗑', text: '删除这个大类', danger: true, hint: count ? count + ' 道菜' : '', value: 'delete' },
      ],
    }).then(function (v) {
      if (v === 'rename') editCategory(id);
      else if (v === 'add') addToCategory(id);
      else if (v === 'solo') {
        S.setAllEnabled(false);
        S.setManyEnabled(S.itemsOf(id).map(function (i) { return i.id; }), true);
        UI.toast('转盘上只留「' + cat.name + '」里的菜');
      } else if (v === 'delete') deleteCategory(id);
    });
  }

  /** 点某道菜右边的「⋯」 */
  function itemMenu(id) {
    var it = S.findItem(id);
    if (!it) return;
    var catName = it.categoryId ? ((S.findCategory(it.categoryId) || {}).name || '未分类') : '未分类';
    UI.sheet({
      title: it.name,
      hint: '当前大类：' + catName,
      items: [
        { icon: '🎯', text: '只转这一道', value: 'solo' },
        { icon: it.enabled ? '⭕' : '✅', text: it.enabled ? '从转盘上撤下来' : '放回转盘', value: 'toggle' },
        { icon: '✏️', text: '改名 / 换大类', value: 'edit' },
        { icon: '🗑', text: '删掉这道菜', danger: true, value: 'delete' },
      ],
    }).then(function (v) {
      if (v === 'solo') solo(id);
      else if (v === 'toggle') S.setEnabled(id, !it.enabled);
      else if (v === 'edit') editItem(id);
      else if (v === 'delete') { S.removeItem(id); UI.toast('已删除「' + it.name + '」'); }
    });
  }

  /** 新建一个大类 */
  function newCategoryFlow() {
    UI.form({
      title: '新建大类',
      hint: '大类就是一组菜的共同归属，比如「滑蛋饭」「面食」「麻辣香锅」。建好之后可以把菜放进去，也可以勾选整个大类一起转。',
      fields: [{ key: 'name', label: '大类名字', placeholder: '例如：滑蛋饭', value: '' }],
      okText: '创建',
    }).then(function (res) {
      if (!res) return;
      var name = String(res.values.name || '').trim();
      if (!name) { UI.toast('名字不能是空的', 'err'); return; }
      var exist = S.categoryByName(name);
      if (exist) { UI.toast('已经有一个叫「' + name + '」的大类了', 'err'); return; }
      S.addCategory(name);
      UI.toast('已创建大类「' + name + '」', 'ok');
      // 顺手问一句要不要马上往里加菜，省得用户再去找
      setTimeout(function () { addToCategory(S.categoryByName(name).id, true); }, 350);
    });
  }

  /** 往某个大类里批量加菜 */
  function addToCategory(catId, justCreated) {
    var cat = S.findCategory(catId);
    if (!cat) return;
    UI.form({
      title: '往「' + cat.name + '」里加菜',
      hint: '一行一个，也可以用顿号/逗号分隔。',
      fields: [{ key: 'names', label: '菜名', type: 'textarea', rows: 5, value: '', placeholder: '麻辣鸡丁滑蛋饭\n五花肉滑蛋饭' }],
      okText: '加进去',
      cancelText: justCreated ? '先不加' : '取消',
    }).then(function (res) {
      if (!res) return;
      var r = addNamesInto(res.values.names, catId);
      if (!r.added && !r.dup) { UI.toast('没看到菜名', 'err'); return; }
      UI.toast('往「' + cat.name + '」加了 ' + r.added + ' 道' + (r.dup ? '，' + r.dup + ' 道已存在' : ''), 'ok');
    });
  }

  function solo(id) {
    S.soloItem(id);
    var it = S.findItem(id);
    switchTab('food');
    UI.toast('转盘上只留「' + (it ? it.name : '') + '」，转吧！');
    setTimeout(spin, 260);
  }

  function editItem(id) {
    var it = S.findItem(id);
    if (!it) return;
    var NEW = '__new__';
    var options = [{ value: '', label: '（未分类）' }]
      .concat(S.data.categories.map(function (c) { return { value: c.id, label: c.name }; }))
      .concat([{ value: NEW, label: '＋ 新建一个大类…' }]);
    UI.form({
      title: '改名 / 换大类',
      fields: [
        { key: 'name', label: '菜名', value: it.name },
        { key: 'categoryId', label: '归属大类', type: 'select', options: options, value: it.categoryId || '', hint: '选「＋ 新建一个大类…」可以现场建一个新的' },
      ],
      extra: [{ text: '删掉这道菜', danger: true, value: 'delete' }],
      okText: '保存',
    }).then(function (res) {
      if (!res) return;
      if (res.action === 'delete') { S.removeItem(id); UI.toast('已删除'); return; }
      var name = String(res.values.name || '').trim();
      var catId = res.values.categoryId || null;

      if (catId === NEW) {
        // 先问大类叫什么，再回来保存这道菜
        UI.form({
          title: '新建大类',
          fields: [{ key: 'name', label: '大类名字', placeholder: '例如：滑蛋饭', value: '' }],
          okText: '创建并归入',
        }).then(function (r2) {
          if (!r2) return;
          var catName = String(r2.values.name || '').trim();
          if (!catName) { UI.toast('名字不能是空的', 'err'); return; }
          var exist = S.categoryByName(catName);
          var cat = exist || S.addCategory(catName);
          if (!cat) return;
          S.updateItem(id, { name: name, categoryId: cat.id });
          UI.toast('已保存到「' + cat.name + '」', 'ok');
        });
        return;
      }

      S.updateItem(id, { name: name, categoryId: catId });
      UI.toast('已保存');
    });
  }

  function editCategory(id) {
    var cat = S.findCategory(id);
    if (!cat) return;
    UI.form({
      title: '重命名大类',
      hint: '改成一个已有大类的名字，会把两个大类合并。',
      fields: [{ key: 'name', label: '大类名', value: cat.name }],
      okText: '保存',
    }).then(function (res) {
      if (!res) return;
      S.renameCategory(id, res.values.name);
      UI.toast('已保存');
    });
  }

  function deleteCategory(id) {
    var cat = S.findCategory(id);
    if (!cat) return;
    var count = S.itemsOf(id).length;
    UI.open({
      title: '删除大类「' + cat.name + '」',
      body: count
        ? '这个大下面还有 ' + count + ' 道菜。你可以只解散大类（菜会回到「未分类」），也可以连菜一起删掉。'

      actions: count
        ? [
            { text: '取消', value: null },
            { text: '只解散大类', value: 'keep' },
            { text: '连菜一起删', value: 'delete', danger: true },

            { text: '取消', value: null },
            { text: '删除', value: 'delete', danger: true },
          ],

      if (!v) return;
      S.removeCategory(id, v === 'delete' ? 'delete' : 'keep');
      UI.toast('已删除大类「' + cat.name + '」');
    });

  /* ============================== 添加菜品 ============================== */

  function parseNames(raw) {
    return String(raw || '')
      .split(/[\n\r,，、;；|]+/)
      .map(function (s) { return s.trim(); })
      .filter(Boolean);
  }

  /** 真正把菜名写进数据，返回统计结果。forcedCatId 不为空时，全部归进那一个大类 */
  function addNames(raw, forcedCatId) {
    var names = parseNames(raw);
    var added = 0, dup = 0, grouped = [];
    names.forEach(function (name) {
      var exist = S.itemByName(name);
      if (exist) {
        // 已经有的菜：如果指定了目标大类、而它现在没归类，就顺手挪进去
        if (forcedCatId && !exist.categoryId) S.updateItem(exist.id, { categoryId: forcedCatId });
        dup++;
        return;
      }
      var catId = forcedCatId || null;
      if (!catId) {
        var sug = W.Classify.suggestForNew(name, S.data.items, S.data.categories);
        if (sug && sug.categoryId) {
          catId = sug.categoryId;
        } else if (sug && sug.newCategoryName) {
          var cat = S.addCategory(sug.newCategoryName, true);
          catId = cat.id;
          S.data.items.forEach(function (it) {
            if (it.id === sug.mateItemId && !it.categoryId) it.categoryId = cat.id;
          });
          grouped.push(sug.newCategoryName);
        }
      }
      S.addItem(name, catId, true);
      added++;
    });
    if (added) { S.save(true); S.emit(); }
    return { added: added, dup: dup, grouped: grouped };
  }

  /** 指定大类地批量加菜（给「往这个大类里加菜」用） */
  function addNamesInto(raw, categoryId) {
    return addNames(raw, categoryId);
  }

  function addResultToast(r, silent) {
    if (!r.added && !r.dup) { if (!silent) UI.toast('先输入菜名吧', 'err'); return; }
    var msg = [];
    if (r.added) msg.push('加了 ' + r.added + ' 道');
    if (r.grouped.length) msg.push('自动新建大类：' + r.grouped.join('、'));
    if (r.dup) msg.push(r.dup + ' 道已存在');
    UI.toast(msg.join('，'), r.added ? 'ok' : 'err');
  }

  function doAdd() {
    var r = addNames(els.addInput.value);
    if (!r.added && !r.dup) { UI.toast('先输入菜名吧', 'err'); return; }
    els.addInput.value = '';
    els.addInput.focus();
    addResultToast(r);
  }

  /**
   * 粘贴多行：`<input>` 会把换行符吃掉（HTML 规范里的 value 清洗算法），
   * 所以多行粘贴必须自己接管，否则「一行一个」根本用不了。
   */
  function onPaste(e) {
    var text = '';
    try {
      var cb = e.clipboardData || global.clipboardData;
      text = cb ? cb.getData('text') : '';
    } catch (err) { return; }
    if (!text || !/[\n\r]/.test(text)) return;
    e.preventDefault();
    var merged = (els.addInput.value ? els.addInput.value + '\n' : '') + text;
    var r = addNames(merged);
    els.addInput.value = '';
    els.addInput.focus();
    addResultToast(r);
  }

  function doSmartGroup() {
    if (!S.data.items.length) { UI.toast('还没有菜品', 'err'); return; }
    var plan = W.Classify.planAll(S.data.items, S.data.categories);
    var idMap = {};
    plan.created.forEach(function (c) {
      var cat = S.addCategory(c.name, true);
      if (cat) idMap[c.id] = cat.id;
    });
    var moved = 0;
    S.data.items.forEach(function (it) {
      var cid = plan.assign[it.id];
      if (!cid) return;
      if (idMap[cid]) cid = idMap[cid];
      if (it.categoryId !== cid) { it.categoryId = cid; moved++; }
    });
    S.save(true); S.emit();
    var created = plan.created.length;
    if (!moved && !created) UI.toast('没找到可以自动归类的规律，可以手动编辑大类');
    else UI.toast('归好 ' + moved + ' 道菜' + (created ? '，新建了 ' + created + ' 个大类' : ''), 'ok');
  }

  /* ============================== 转盘 ============================== */

  function syncWheel() {
    var items = S.enabledItems();
    wheel.setItems(items);
    els.spinSub.textContent = items.length + ' 个';
    els.btnSpin.disabled = items.length === 0 || wheel.spinning;
  }

  function spin() {
    var items = S.enabledItems();
    if (!items.length) {
      UI.toast('转盘上还没有菜，先去「菜品」里加几个', 'err');
      switchTab('food');
      return;
    }
    if (wheel.spinning) return;
    wheel.setItems(items);
    els.resultCard.hidden = true;
    els.decidedCard.hidden = true;
    els.resultEmpty.hidden = false;
    els.btnSpin.disabled = true;
    W.Sound.enabled = !!S.settings.sound;
    els.btnSpin.classList.add('spinning');

    wheel.spin({ duration: S.settings.duration, sound: !!S.settings.sound }).then(function (res) {
      els.btnSpin.classList.remove('spinning');
      els.btnSpin.disabled = false;
      if (!res) return;
      showResult(res.item);
      S.addHistory(res.item.name);
      if (S.settings.confetti) UI.confetti();
      if (S.settings.removeAfterPick) {
        setTimeout(function () { S.setEnabled(res.item.id, false); }, 1400);

  function showResult(item) {

    els.resultName.textContent = item.name;
    els.resultCat.textContent = cat ? '大类：' + cat.name : '';
    els.decidedCard.hidden = true;
    els.resultEmpty.hidden = true;
    els.resultCard.hidden = false;
    els.resultCard.style.animation = 'none';
    void els.resultCard.offsetWidth;
    els.resultCard.style.animation = '';
  }

  /**
   * 「就吃这个」：把结果定下来。
   * 以前转完只有「再转一次」和「从转盘移除」——想收手只能按返回键，
   * 所以补一个明确的「结束」动作，并把决定记下来（当天有效）。
   */
  function decideCurrent(item) {
    if (!item) return;
    els.resultCard.hidden = true;   // 先收起结果卡，再让「已定」卡接管（顺序反了会被它顶掉）
    S.setDecided(item.name, item.categoryId || null);
    S.addHistory(item.name);
    if (S.settings.confetti) UI.confetti();
    UI.toast('今天就吃「' + item.name + '」！', 'ok', 3000);
  }

  function renderDecided() {
    var d = S.todayDecided();
    if (!d) {
      els.decidedCard.hidden = true;
      return false;
    }
    // 刚转出结果、还没点「就吃这个」时，别把「已定」卡顶上来
    if (!els.resultCard.hidden) return false;
    var cat = d.categoryId ? S.findCategory(d.categoryId) : null;
    els.decidedName.textContent = d.name;
    els.decidedCat.textContent = cat ? '大类：' + cat.name : '';
    els.decidedCard.hidden = false;
    els.resultEmpty.hidden = true;
    return true;
  }

  function renderHistory() {
    var box = els.history;
    U.clear(box);
    var list = (S.data.history || []).slice(0, 6);
    if (!list.length) return;
    box.appendChild(el('span', { class: 'history-chip', text: '最近：' }));
    list.forEach(function (n) {
      box.appendChild(el('span', { class: 'history-chip', text: n }));
    });
  }

  /* ============================== 拍照识别 ============================== */

  function setStatus(text, kind) {
    var box = els.photoStatus;
    U.clear(box);
    if (!text) { box.hidden = true; return; }
    box.hidden = false;
    box.className = 'status' + (kind ? ' ' + kind : '');
    if (kind === 'loading') box.appendChild(el('span', { class: 'spinner' }));
    box.appendChild(el('span', { text: text }));
  }

  function renderPreview() {
    var box = els.photoPreview;
    U.clear(box);
    if (!photoFiles.length) { box.hidden = true; return; }
    box.hidden = false;
    photoFiles.forEach(function (url) {
      box.appendChild(el('img', { src: url, alt: '待识别的照片' }));
    });
  }

  function handleFiles(files) {
    files = (files || []).filter(function (f) { return /^image\//.test(f.type || ''); });
    if (!files.length) { UI.toast('没有选到图片', 'err'); return; }
    files = files.slice(0, 4);

    els.recognized.hidden = true;
    recognizedDishes = [];
    setStatus('正在压缩图片…', 'loading');

    Promise.all(files.map(function (f) { return U.compressImage(f, 1280, 0.85); }))
      .then(function (urls) {
        photoFiles = urls;
        renderPreview();
        var v = S.settings.vision;
        if (!v.apiKey) throw new Error('还没有配置视觉模型 API Key。去「⚙️ 设置」填一下，或者手动在「菜品」里输入菜名。');
        setStatus('正在识别（大约 5~20 秒）…', 'loading');
        return W.Vision.recognize(S.settings, urls, function (t) { setStatus(t, 'loading'); });
      })
      .then(function (res) {
        recognizedDishes = res.dishes || [];
        if (!recognizedDishes.length) {
          setStatus('这张照片里没认出菜品，换一张更清楚的菜牌试试～', 'err');
          return;
        }
        setStatus('认出 ' + recognizedDishes.length + ' 道菜，确认一下再加进转盘：', 'ok');
        renderRecognized();
      })
      .catch(function (err) {
        setStatus((err && err.message) || String(err), 'err');
      });
  }

  function renderRecognized() {
    var box = els.recognized;
    U.clear(box);
    if (!recognizedDishes.length) { box.hidden = true; return; }
    box.hidden = false;

    var datalist = el('datalist', { id: 'cat-options' });
    S.data.categories.forEach(function (c) { datalist.appendChild(el('option', { value: c.name })); });
    box.appendChild(datalist);

    box.appendChild(el('div', { class: 'rec-head' }, [
      el('span', { text: '识别结果（可改名字、可改大类）' }),
    ]));

    recognizedDishes.forEach(function (d, idx) {
      var nameInput = el('input', { class: 'input rec-name', type: 'text', value: d.name });
      var catInput = el('input', { class: 'input rec-cat', type: 'text', list: 'cat-options', value: d.category || '', placeholder: '大类' });
      nameInput.addEventListener('input', function () { d.name = nameInput.value; });
      catInput.addEventListener('input', function () { d.category = catInput.value; });
      var row = el('div', { class: 'rec-row' }, [
        nameInput,
        catInput,
        el('button', { class: 'mini danger', text: '✕', title: '不要这道', onclick: function () {
          recognizedDishes.splice(idx, 1);
          renderRecognized();
        } }),
      ]);
      box.appendChild(row);
    });

    box.appendChild(el('div', { class: 'rec-actions' }, [
      el('button', { class: 'btn primary', text: '全部加入转盘', onclick: commitRecognized }),
      el('button', { class: 'btn ghost', text: '都不要', onclick: function () {
        recognizedDishes = [];
        renderRecognized();
        setStatus('已取消', null);
      } }),
    ]));
  }

  function commitRecognized() {
    var added = 0, dup = 0, newCats = [];
    recognizedDishes.forEach(function (d) {
      var name = String(d.name || '').trim();
      if (!name) return;
      if (S.itemByName(name)) { dup++; return; }
      var catId = null;
      var catName = String(d.category || '').trim();
      if (catName) {
        var existed = S.categoryByName(catName);
        var cat = S.addCategory(catName, true);
        catId = cat ? cat.id : null;
        if (!existed && cat) newCats.push(catName);
      }
      S.addItem(name, catId, true);
      added++;
    });
    S.save(true); S.emit();
    recognizedDishes = [];
    renderRecognized();
    setStatus('已加入 ' + added + ' 道菜' + (newCats.length ? '，新建大类：' + newCats.join('、') : ''), 'ok');
    UI.toast('加了 ' + added + ' 道菜' + (dup ? '，' + dup + ' 道重复已跳过' : ''), 'ok');
    setTimeout(function () { switchTab('food'); }, 400);
  }

  /* ============================== 设置页 ============================== */

  function fillProviders() {
    var sel = els.setProvider;
    U.clear(sel);
    S.PROVIDERS.forEach(function (p) {
      sel.appendChild(el('option', { value: p.id, text: p.name }));
    });
  }

  function syncSettingsUI() {
    var v = S.settings.vision;
    els.setProvider.value = v.provider || 'custom';
    els.setBaseUrl.value = v.baseUrl || '';
    els.setModel.value = v.model || '';
    els.setApiKey.value = v.apiKey || '';
    els.setProxy.checked = !!v.useProxy;
    var p = null;
    S.PROVIDERS.forEach(function (x) { if (x.id === v.provider) p = x; });
    els.providerHint.textContent = p ? p.hint : '';

    els.setSound.checked = !!S.settings.sound;
    els.setRemove.checked = !!S.settings.removeAfterPick;
    els.setConfetti.checked = !!S.settings.confetti;
    els.setDuration.value = S.settings.duration;
    els.setDurationVal.textContent = Number(S.settings.duration).toFixed(1) + 's';
    if (location.protocol === 'file:') {
      els.setProxy.disabled = true;
      els.setProxy.checked = false;
      if (v.useProxy) S.setVision({ useProxy: false });
    }
    renderStats();
  }

  function renderStats() {
    var st = S.stats();
    var extra = U.storage.ok ? '' : '（注意：当前环境无法写入本地存储，刷新会丢数据，记得用「导出备份」）';
    els.statHint.textContent = st.items + ' 道菜 · ' + st.categories + ' 个大类 · 转盘上 ' + st.enabled + ' 道' + extra;
  }

  function saveVisionFromUI() {
    S.setVision({
      baseUrl: els.setBaseUrl.value.trim(),
      model: els.setModel.value.trim(),
      apiKey: els.setApiKey.value.trim(),
      useProxy: els.setProxy.checked,
    });
  }

  function testConnection() {
    saveVisionFromUI();
    var v = S.settings.vision;
    if (!v.apiKey) { UI.toast('先填 API Key', 'err'); return; }
    els.btnTest.disabled = true;
    els.btnTest.textContent = '测试中…';
    W.Vision.test(S.settings).then(function (r) {
      UI.toast(r.message, 'ok', 3600);
    }).catch(function (err) {
      UI.toast(err.message || String(err), 'err', 6000);
    }).then(function () {
      els.btnTest.disabled = false;
      els.btnTest.textContent = '测试连接';
    });
  }

  function exportData() {
    var data = S.exportObject();
    U.download('吃啥转盘-备份-' + U.stamp() + '.json', JSON.stringify(data, null, 2));
    UI.toast('备份已导出', 'ok');
  }

  function importData() {
    U.pickFile($('file-import')).then(function (files) {
      if (!files.length) return;
      U.readTextFile(files[0]).then(function (text) {
        var obj;
        try { obj = JSON.parse(text); }
        catch (e) { UI.toast('这个文件不是合法 JSON', 'err'); return; }
        return UI.open({
          title: '导入备份',
          body: '导入方式：追加（保留现有菜品，重复的跳过）还是覆盖（清空现有菜品再导入）？',
          actions: [
            { text: '取消', value: null },
            { text: '追加', value: 'append' },
            { text: '覆盖', value: 'replace', danger: true },
          ],
        }).then(function (mode) {
          if (!mode) return;
          try {
            var r = S.importObject(obj, mode);
            UI.toast('导入完成：新增 ' + r.added + ' 道，跳过重复 ' + r.dup + ' 道', 'ok', 3600);
          } catch (e) {
            UI.toast('导入失败：' + e.message, 'err', 5000);
          }
        });
      }).catch(function (e) { UI.toast('读取失败：' + e.message, 'err'); });
    });
  }

  function copyData() {
    var text = JSON.stringify(S.exportObject());
    function fallback() {
      UI.form({
        title: '复制数据',
        hint: '长按下面的文字全选复制，粘贴到备忘录或聊天窗口保存即可。',
        fields: [{ key: 'text', label: '备份内容', type: 'textarea', value: text }],
        okText: '关闭',
      });
    }
    if (global.navigator && global.navigator.clipboard && global.navigator.clipboard.writeText) {
      global.navigator.clipboard.writeText(text).then(function () { UI.toast('已复制到剪贴板', 'ok'); }, fallback);
    } else fallback();
  }

  function resetAll() {
    UI.open({
      title: '恢复出厂设置',
      body: '会清空所有菜品、大类、历史记录和设置（API Key 也会没）。确定吗？',
      actions: [
        { text: '取消', value: null },
        { text: '清空', value: 'yes', danger: true },
      ],
    }).then(function (v) {
      if (v !== 'yes') return;
      S.resetAll();
      syncSettingsUI();
      UI.toast('已清空', 'ok');
    });
  }

  /* ============================== 帮助 ============================== */

  function showHelp() {
    UI.open({
      title: '怎么用「吃啥转盘」',
      body: el('div', { html: [
        '<ul>',
        '<li><b>加菜</b>：在「🍽 菜品」里打字回车就能加；一行一个可以一次加一串。</li>',
        '<li><b>大类 / 小项</b>：像「麻辣鸡丁滑蛋饭」「五花肉滑蛋饭」会自动归到「滑蛋饭」这个大类。' +
          '勾大类 = 把这个大类下的都放上转盘；只勾某一道 = 只转那一道。</li>',
        '<li><b>自己建大类</b>：点「＋ 新建大类」就能建一个自己的分类；' +
          '想改名或删除，点大类右边那个 <b>⋯</b>；想给某道菜换大类，点这道菜右边的 <b>⋯</b>。</li>',
        '<li><b>智能归类</b>：如果菜名没归好，点一下「✨ 智能归类」，它会按菜名后缀重新分大类。</li>',
        '<li><b>拍照识别</b>：拍一张食堂菜牌，自动认出菜名再加进转盘。需要先在「⚙️ 设置」里填一个视觉模型的 API Key。</li>',
        '<li><b>转盘</b>：点中间那个「转」，停下来指到哪道就吃哪道。' +
          '转完可以点「✅ 就吃这个」把决定定下来，也可以「再转一次」或者把它从转盘撤掉。</li>',
        '<li><b>数据在哪</b>：全部存在这台设备本地，不上传。换设备用「设置 → 导出备份 / 导入备份」。</li>',
        '</ul>',
        '<p>小技巧：把网页「添加到主屏幕」，就跟装了个 App 一样，全屏、离线都能用。</p>',
      ].join('') }),
      actions: [{ text: '开始干饭', primary: true, value: 'ok' }],
    });
  }

  /* ============================== 启动 ============================== */

  function cacheEls() {
    els.btnTheme = $('btn-theme');
    els.btnHelp = $('btn-help');
    els.btnSpin = $('btn-spin');
    els.spinSub = $('spin-sub');
    els.resultBar = $('result-bar');
    els.resultEmpty = $('result-empty');
    els.resultCard = $('result-card');
    els.resultName = $('result-name');
    els.resultCat = $('result-cat');
    els.btnAgain = $('btn-again');
    els.btnDrop = $('btn-drop');
    els.btnDone = $('btn-done');
    els.decidedCard = $('decided-card');
    els.decidedName = $('decided-name');
    els.decidedCat = $('decided-cat');
    els.btnUndecide = $('btn-undecide');
    els.history = $('history');

    els.addInput = $('add-input');
    els.btnAdd = $('btn-add');
    els.btnNewCat = $('btn-newcat');
    els.btnSmart = $('btn-smart');
    els.btnAll = $('btn-all');
    els.btnNone = $('btn-none');
    els.btnInvert = $('btn-invert');
    els.btnClear = $('btn-clear');
    els.catList = $('cat-list');

    els.btnCamera = $('btn-camera');
    els.btnAlbum = $('btn-album');
    els.fileCamera = $('file-camera');
    els.fileAlbum = $('file-album');
    els.photoPreview = $('photo-preview');
    els.photoStatus = $('photo-status');
    els.recognized = $('recognized');

    els.setProvider = $('set-provider');
    els.providerHint = $('provider-hint');
    els.setBaseUrl = $('set-baseurl');
    els.setModel = $('set-model');
    els.setApiKey = $('set-apikey');
    els.setProxy = $('set-proxy');
    els.btnEye = $('btn-eye');
    els.btnTest = $('btn-test');
    els.btnSaveVision = $('btn-save-vision');
    els.setSound = $('set-sound');
    els.setRemove = $('set-remove');
    els.setConfetti = $('set-confetti');
    els.setDuration = $('set-duration');
    els.setDurationVal = $('set-duration-val');
    els.btnExport = $('btn-export');
    els.btnImport = $('btn-import');
    els.btnCopy = $('btn-copy');
    els.btnReset = $('btn-reset');
    els.statHint = $('stat-hint');
  }

  function bind() {
    els.btnTheme.addEventListener('click', cycleTheme);
    els.btnHelp.addEventListener('click', showHelp);

    U.$$('.tab').forEach(function (t) {
      t.addEventListener('click', function () { switchTab(t.dataset.tab); });
    });

    els.btnSpin.addEventListener('click', spin);
    els.btnAgain.addEventListener('click', spin);
    els.btnDone.addEventListener('click', function () {
      if (lastPicked) decideCurrent(lastPicked);
    });
    els.btnUndecide.addEventListener('click', function () {
      S.clearDecided();
      els.decidedCard.hidden = true;
      els.resultEmpty.hidden = false;
    });
    els.btnDrop.addEventListener('click', function () {
      if (!lastPicked) return;
      S.setEnabled(lastPicked.id, false);
      UI.toast('「' + lastPicked.name + '」已从转盘移除');
      els.resultCard.hidden = true;
      els.resultEmpty.hidden = false;
      lastPicked = null;
    });

    els.btnAdd.addEventListener('click', doAdd);
    els.addInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doAdd(); }
    });
    els.addInput.addEventListener('paste', onPaste);
    els.btnNewCat.addEventListener('click', newCategoryFlow);
    els.btnSmart.addEventListener('click', doSmartGroup);
    els.btnAll.addEventListener('click', function () { S.setAllEnabled(true); });
    els.btnNone.addEventListener('click', function () { S.setAllEnabled(false); });
    els.btnInvert.addEventListener('click', function () { S.invertEnabled(); });
    els.btnClear.addEventListener('click', function () {
      if (!S.data.items.length) { UI.toast('已经是空的'); return; }
      UI.open({
        title: '清空所有菜品',
        body: '会删掉全部 ' + S.data.items.length + ' 道菜（大类保留）。确定吗？',
        actions: [{ text: '取消', value: null }, { text: '清空', value: 'yes', danger: true }],
      }).then(function (v) { if (v === 'yes') { S.clearItems(); UI.toast('已清空', 'ok'); } });
    });

    els.btnCamera.addEventListener('click', function () {
      U.pickFile(els.fileCamera).then(handleFiles);
    });
    els.btnAlbum.addEventListener('click', function () {
      U.pickFile(els.fileAlbum).then(handleFiles);
    });

    els.setProvider.addEventListener('change', function () {
      var p = S.applyProvider(els.setProvider.value);
      syncSettingsUI();
      if (p && !p.baseUrl) UI.toast('这是自定义服务商，手动填接口地址和模型名');
    });
    [els.setBaseUrl, els.setModel, els.setApiKey].forEach(function (node) {
      node.addEventListener('change', saveVisionFromUI);
      node.addEventListener('blur', saveVisionFromUI);
    });
    els.setProxy.addEventListener('change', function () {
      saveVisionFromUI();
      UI.toast(els.setProxy.checked ? '已开启本地代理' : '已关闭本地代理');
    });
    els.btnEye.addEventListener('click', function () {
      els.setApiKey.type = els.setApiKey.type === 'password' ? 'text' : 'password';
    });
    els.btnTest.addEventListener('click', testConnection);
    els.btnSaveVision.addEventListener('click', function () { saveVisionFromUI(); UI.toast('已保存', 'ok'); });

    els.setSound.addEventListener('change', function () { S.setSetting('sound', els.setSound.checked); });
    els.setRemove.addEventListener('change', function () { S.setSetting('removeAfterPick', els.setRemove.checked); });
    els.setConfetti.addEventListener('change', function () { S.setSetting('confetti', els.setConfetti.checked); });
    els.setDuration.addEventListener('input', function () {
      els.setDurationVal.textContent = Number(els.setDuration.value).toFixed(1) + 's';
    });
    els.setDuration.addEventListener('change', function () { S.setSetting('duration', Number(els.setDuration.value)); });

    els.btnExport.addEventListener('click', exportData);
    els.btnImport.addEventListener('click', importData);
    els.btnCopy.addEventListener('click', copyData);
    els.btnReset.addEventListener('click', resetAll);

    // 空格键转一把
    document.addEventListener('keydown', function (e) {
      var tag = (e.target && e.target.tagName) || '';
      if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
      if (e.code === 'Space' || e.key === ' ') {
        if (!els.resultCard.hidden) return;
        e.preventDefault();
        spin();
      }
    });

    if (media && media.addEventListener) {
      media.addEventListener('change', function () { if ((S.settings.theme || 'auto') === 'auto') applyTheme(); });
    }
  }

  function boot() {
    cacheEls();

    // 兜底：任何未捕获的错误都先把遮罩关掉。
    // 手机上的报错我这边看不到，但至少要保证「出错了还能继续点」，而不是整个界面卡死。
    global.addEventListener('error', function (e) {
      if (e && (e.error || typeof e.message === 'string') && e.message) UI.panic(e.error || e.message);
    });
    global.addEventListener('unhandledrejection', function (e) { UI.panic(e && e.reason); });

    UI.init();
    S.load();
    applyTheme();
    fillProviders();

    // 安卓原生壳里 WebView 是 edge-to-edge 的，而 env(safe-area-inset-top) 常常是 0，
    // 顶栏会被状态栏压住。打上这个 class 后 CSS 会给一个保底的安全区高度。
    try {
      var cap = global.Capacitor;
      var isNative = !!(cap && ((cap.isNativePlatform && cap.isNativePlatform()) || cap.isNative));
      if (isNative) document.documentElement.classList.add('is-native');
    } catch (e) { /* 不是原生壳就算了 */ }

    wheel = new W.Wheel($('wheel'));
    W.Sound.enabled = !!S.settings.sound;

    var wrap = document.querySelector('.wheel-wrap');
    if (global.ResizeObserver) {
      new global.ResizeObserver(function () { wheel.resize(); }).observe(wrap);
    } else {
      global.addEventListener('resize', function () { wheel.resize(); });
    }

    S.on(function () {
      syncWheel();
      renderList();
      renderHistory();
      renderStats();
      renderDecided();
    });

    bind();
    syncSettingsUI();
    syncWheel();
    renderList();
    renderHistory();
    renderStats();
    renderDecided();
    setTimeout(function () { wheel.resize(); }, 60);

    var seenHelp = false;
    try {
      seenHelp = !!global.localStorage.getItem('wtw-seen-help');
      if (!seenHelp) global.localStorage.setItem('wtw-seen-help', '1');
    } catch (e) { seenHelp = true; /* 存储不可用就别弹了 */ }
    if (!seenHelp) setTimeout(showHelp, 500);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
</body>
</html>
